# Broker for the CI headless-CLI gate. Anonymous on purpose: this container exists
# only for the job, on a runner-local network, and is torn down with it.
listener 1883
allow_anonymous true
persistence false

# The gate asserts a real refusal, not a simulated one: publishing anywhere outside
# cli-gate/# must come back as a broker verdict (0x87), which is the only way to prove
# the CLI reports "the broker said no" instead of "sent".
acl_file /mosquitto/config/mosquitto.acl
