# Reference config for the CI headless-CLI gate broker.
#
# The workflow writes its own copy of this at run time (with $GITHUB_WORKSPACE filled
# in), because a `services:` container starts before the first step and would bind-mount
# an empty directory. This file is what that generated config looks like, kept here so a
# local reproduction has one source.
#
# Authenticated, not anonymous: mosquitto's `pattern` ACL lines do not apply to
# anonymous clients, so an anonymous broker *accepts* the publish the gate expects to
# see refused. That is how the gate went green locally and red in CI -- see
# docs/ITERATION_2026_09.md §4.74.
listener 1883 127.0.0.1
allow_anonymous false
persistence false
password_file /tmp/mosquitto-gate.pass
acl_file /mosquitto/config/mosquitto.acl
