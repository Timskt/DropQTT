name: CI Quality Gate

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint (tsc cannot see hook dependency and ref-during-render bugs)
        # Threshold is today's exact warning count (all react-hooks/set-state-in-effect
        # or purity, on polling hooks where it is idiomatic). Raising it must be a
        # deliberate decision, and lowering it as the warnings get fixed.
        run: pnpm run lint --max-warnings=10

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  ui:
    name: UI (Playwright + mocked Tauri IPC)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:ui

  backend:
    name: Rust (check + clippy + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Clippy (warnings are errors)
        working-directory: src-tauri
        # --all-targets, because the headless CLI is a second binary and its warnings
        # would otherwise be linted by nobody.
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  cli:
    name: Headless CLI (exit-code contract against a real broker)
    runs-on: ubuntu-22.04
    env:
      # Not 1883: installing the mosquitto package enables a systemd unit that binds the
      # default port, and a gate cannot tell that broker from the one it configured.
      GATE_PORT: 18831
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             libssl-dev             libxdo-dev             libayatana-appindicator3-dev             librsvg2-dev             libdbus-1-dev             pkg-config             mosquitto             mosquitto-clients

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build the CLI
        working-directory: src-tauri
        run: cargo build --bin dropqtt-cli

      # A broker installed here rather than a `services:` container: services start
      # before the first step, so a bind mount of a repository file would see an empty
      # directory and mosquitto would refuse to start.
      - name: Start the gate broker
        run: |
          PASS=$(openssl rand -hex 12)
          mosquitto_passwd -c -b /tmp/mosquitto-gate.pass gateuser "$PASS"
          # Hand the password to the gate steps through the job environment: it is a
          # throwaway for a loopback broker that dies with this job, and the CLI takes
          # passwords only from a variable, never from the command line.
          echo "MQTT_GATE_PASS=$PASS" >> "$GITHUB_ENV"
          cat > /tmp/mosquitto-gate.conf <<EOF
          listener $GATE_PORT 127.0.0.1
          allow_anonymous false
          persistence false
          password_file /tmp/mosquitto-gate.pass
          acl_file $GITHUB_WORKSPACE/.github/ci/mosquitto.acl
          EOF
          # No `-d`: it returns 0 even when the listener never bound, so a failed bind is
          # invisible to the step and the gate then runs against whatever else holds the
          # port. Without that flag the config and bind errors stay in the log below.
          /usr/sbin/mosquitto -c /tmp/mosquitto-gate.conf -v > /tmp/mosquitto-gate.log 2>&1 &
          for i in $(seq 1 30); do
            if timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$GATE_PORT" 2>/dev/null; then
              echo "gate broker is listening on $GATE_PORT"
              exit 0
            fi
            sleep 1
          done
          echo "gate broker never came up on $GATE_PORT"
          cat /tmp/mosquitto-gate.log
          ss -ltnp || true
          exit 1

      - name: Run the gate
        # The ACL grants only cli-gate/# to gateuser, so the gate can assert a genuine
        # broker refusal (0x87) rather than a simulated one. The gate proves that before
        # anything else: an anonymous publish has to be rejected, or the broker answering
        # is not this one and every assertion below would be measuring the wrong rig.
        env:
          GATE_DENY_TOPIC: secret/never-granted
          GATE_USER: gateuser
          GATE_PASSWORD_ENV: MQTT_GATE_PASS
        run: bash scripts/cli-gate.sh ./src-tauri/target/debug/dropqtt-cli 127.0.0.1 "$GATE_PORT"

      - name: Run the scenario gate
        # Same broker, same user: the rig's topic has to live under the one tree the
        # ACL grants, so it is pointed at cli-gate/… rather than the local default.
        env:
          SCENARIO_TOPIC: cli-gate/scenario/telemetry
          GATE_USER: gateuser
          GATE_PASSWORD_ENV: MQTT_GATE_PASS
        run: bash scripts/scenario-gate.sh ./src-tauri/target/debug/dropqtt-cli 127.0.0.1 "$GATE_PORT"
