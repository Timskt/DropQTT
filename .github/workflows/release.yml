name: Release DropQTT

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    # Secrets are not readable from a step `if:`, so they are mapped to env once here and
    # every gate below tests `env.*`. An unset secret is an empty string, which is what the
    # "is signing configured?" branch keys on: without the secrets the job builds exactly
    # the way it always did, and with them it must produce a Developer ID artifact or fail.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux-specific dependencies for WebKitGTK / Tauri v2
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches application versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          CARGO_VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=${GITHUB_REF_NAME} package=${PKG_VERSION} tauri=${TAURI_VERSION} cargo=${CARGO_VERSION}"
          test "${GITHUB_REF_NAME}" = "v${PKG_VERSION}"
          test "${PKG_VERSION}" = "${TAURI_VERSION}"
          test "${PKG_VERSION}" = "${CARGO_VERSION}"

      - name: Frontend typecheck & build gate
        run: |
          pnpm exec tsc --noEmit
          pnpm build

      - name: Rust check & test gate
        working-directory: src-tauri
        run: |
          cargo test

      # Half-configured signing is worse than none: the job would go green while shipping a
      # Developer ID app that Gatekeeper blocks, because notarization needs its own
      # credentials. So either the certificate and a notarization credential pair are both
      # present, or this leg ships the way it always has.
      - name: Refuse half-configured macOS signing
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] || missing="$missing APPLE_CERTIFICATE_PASSWORD"
          [ -n "${APPLE_SIGNING_IDENTITY:-}" ] || missing="$missing APPLE_SIGNING_IDENTITY"
          notarized=0
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then notarized=1; fi
          if [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then notarized=1; fi
          [ "$notarized" = 1 ] || missing="$missing (APPLE_ID+APPLE_PASSWORD+APPLE_TEAM_ID or APPLE_API_KEY+APPLE_API_ISSUER)"
          if [ -n "$missing" ]; then
            echo "::error::APPLE_CERTIFICATE is set but these are not:$missing — refusing to ship a signed-but-unnotarized app"
            exit 1
          fi
          echo "signing identity: $APPLE_SIGNING_IDENTITY, notarization credentials present"

      - name: Import the Developer ID certificate
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          PW=$(openssl rand -hex 16)
          security create-keychain -p "$PW" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$PW" "$KC"
          # 6 h: a notarial submission waits, and the default timeout would take the
          # keychain down mid-build.
          security set-keychain-settings -lut 21600 "$KC"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Keep the runner's own chain reachable, or the Apple trust anchors disappear and
          # every signature later in the job fails to build a chain.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          # Fail here rather than inside the bundle step: `codesign` reports an unknown
          # identity as a build error that reads like a toolchain problem.
          if ! security find-identity -v -p codesigning "$KC" | grep -Fq "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::'$APPLE_SIGNING_IDENTITY' is not a valid code-signing identity in the imported certificate"
            security find-identity -v -p codesigning "$KC" || true
            exit 1
          fi

      - name: Build and package Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key used to sign updater artifacts (latest.json + .sig).
          # Set both in repo secrets: `tauri signer generate` to create the key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DropQTT ${{ github.ref_name }}'
          releaseBody: 'Automated release for ${{ github.ref_name }}. Download installers for macOS (Apple Silicon & Intel DMG), Linux (DEB & AppImage), and Windows (MSI & NSIS exe).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # The claim being checked is the one that caused a user-visible bug: an ad-hoc
      # signature makes the login keychain's ACL depend on the CDHash, so it changes every
      # build and "Always Allow" on the broker password dies with the next update. Green
      # jobs did not prove that was fixed; this does.
      - name: Verify the macOS artifact is Developer ID signed and notarized
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          args="${{ matrix.args }}"
          triple=""
          case "$args" in
            *--target\ *) triple=$(printf '%s' "$args" | awk '{print $2}') ;;
          esac
          base="src-tauri/target"
          [ -n "$triple" ] && base="$base/$triple"
          dir="$base/release/bundle/macos"
          # Checked before the find: with `set -e` a failing pipeline ends the step on
          # `find`'s own message, and the operator reading the log needs the sentence
          # that says *nothing was verified* rather than a path error.
          if [ ! -d "$dir" ]; then
            echo "::error::no bundle directory at $dir — the signature was not verified"
            exit 1
          fi
          app=$(find "$dir" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$app" ]; then
            echo "::error::no .app under $dir — nothing was verified"
            exit 1
          fi
          python3 scripts/check-macos-signed.py "$app" --require-developer-id
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          echo "notarytool history (last submissions):"
          xcrun notarytool history --output-format json 2>/dev/null | head -20 || true
