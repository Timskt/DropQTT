name: Release DropQTT

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux-specific dependencies for WebKitGTK / Tauri v2
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches application versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          CARGO_VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=${GITHUB_REF_NAME} package=${PKG_VERSION} tauri=${TAURI_VERSION} cargo=${CARGO_VERSION}"
          test "${GITHUB_REF_NAME}" = "v${PKG_VERSION}"
          test "${PKG_VERSION}" = "${TAURI_VERSION}"
          test "${PKG_VERSION}" = "${CARGO_VERSION}"

      - name: Frontend typecheck & build gate
        run: |
          pnpm exec tsc --noEmit
          pnpm build

      - name: Rust check & test gate
        working-directory: src-tauri
        run: |
          cargo test

      # Mapping secrets into `env:` at job level is what broke v0.12.3's two macOS legs:
      # an unset secret still *defines* the variable as empty, and tauri-bundler treats a
      # present `APPLE_CERTIFICATE` as "import this certificate" —
      # `SecKeychainItemImport: One or more parameters passed to a function were not valid`
      # — so "no secrets configured" stopped meaning "build the way you always did".
      # The variables are therefore only exported when they actually hold a value, and the
      # gates below read a sentinel rather than testing an absent variable.
      - name: Export the signing configuration, if there is one
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY: ${{ vars.APPLE_NOTARIZE }}
          N_ID: ${{ secrets.APPLE_ID }}
          N_PW: ${{ secrets.APPLE_PASSWORD }}
          N_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          N_API_KEY: ${{ secrets.APPLE_API_KEY }}
          N_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$CERT" ]; then
            echo "MACOS_SIGNED=0" >> "$GITHUB_ENV"
            echo "no certificate configured — building unsigned, exactly as before"
            exit 0
          fi
          # Same trap as above, one level down: an empty APPLE_ID would be "present" to
          # the bundler too, so the optional credentials are only exported when they hold
          # something.
          emit() { [ -n "$2" ] && printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV" || true; }
          {
            echo "MACOS_SIGNED=1"
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_NOTARIZE=${NOTARY:-0}"
          } >> "$GITHUB_ENV"
          emit APPLE_ID "$N_ID"
          emit APPLE_PASSWORD "$N_PW"
          emit APPLE_TEAM_ID "$N_TEAM"
          emit APPLE_API_KEY "$N_API_KEY"
          emit APPLE_API_ISSUER "$N_API_ISSUER"

      # Two different mistakes hide behind "signing is configured". Half-set credentials
      # would ship a signed app whose notarization silently never happened; and a
      # self-signed identity (scripts/macos-selfsigned-identity.sh) cannot be notarized at
      # all — Apple only notarizes Developer ID — so opting into that path has to be
      # explicit rather than inferred. Hence APPLE_NOTARIZE.
      - name: Preflight the macOS signing configuration
        if: matrix.platform == 'macos-latest' && env.MACOS_SIGNED == '1'
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] || missing="$missing APPLE_CERTIFICATE_PASSWORD"
          [ -n "${APPLE_SIGNING_IDENTITY:-}" ] || missing="$missing APPLE_SIGNING_IDENTITY"
          if [ -n "$missing" ]; then
            echo "::error::APPLE_CERTIFICATE is set but these are not:$missing"
            exit 1
          fi
          notarized=0
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then notarized=1; fi
          if [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then notarized=1; fi
          if [ "${APPLE_NOTARIZE:-0}" = "1" ] && [ "$notarized" != "1" ]; then
            echo "::error::APPLE_NOTARIZE=1 but no notarization credentials — refusing to ship a signed-but-unnotarized app while claiming otherwise"
            echo "   need APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID, or APPLE_API_KEY + APPLE_API_ISSUER"
            exit 1
          fi
          if [ "$notarized" = "1" ]; then
            echo "signing with '$APPLE_SIGNING_IDENTITY', notarization credentials present"
          else
            echo "::warning::signing with '$APPLE_SIGNING_IDENTITY' and NOT notarizing."
            echo "::warning::Gatekeeper rejects this for quarantined downloads — measured to behave"
            echo "::warning::the same as the current ad-hoc build, so nothing regresses; a Developer"
            echo "::warning::ID certificate is still required for strangers to double-click the DMG."
          fi

      - name: Import the code-signing certificate into a build keychain
        if: matrix.platform == 'macos-latest' && env.MACOS_SIGNED == '1'
        shell: bash
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          PW=$(openssl rand -hex 16)
          security create-keychain -p "$PW" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$PW" "$KC"
          # 6 h: a notarial submission waits, and the default timeout would take the
          # keychain down mid-build.
          security set-keychain-settings -lut 21600 "$KC"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Keep the runner's own chain reachable, or the Apple trust anchors disappear and
          # every signature later in the job fails to build a chain.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          # The documented Tauri recipe, and the only way a *headless* runner is allowed to
          # use the private key: without this codesign fails with an access check that would
          # normally be answered by a GUI prompt nobody is there to click.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KC"
      # Fail here rather than inside the bundle step, where an unusable identity surfaces as
      # a build error that reads like a toolchain problem.
      #
      # `security find-identity -v` cannot be the check: it only lists identities the
      # keychain services consider *trusted*, and a self-signed certificate is always
      # CSSMERR_TP_NOT_TRUSTED — measured on 2026-10-11, it reported "0 valid identities"
      # for an identity that codesign then used successfully. Trust display is not the
      # property we need; the ability to sign is. So the gate signs a throwaway binary and
      # asserts the property this whole identity exists for: a signature whose designated
      # requirement is the certificate, not a CDHash that changes on every build.
      - name: Smoke-test the signing identity before the build
        if: matrix.platform == 'macos-latest' && env.MACOS_SIGNED == '1'
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sign-smoke"
          rm -rf "$dir"; mkdir -p "$dir"
          printf 'int main(void){return 0;}\n' > "$dir/smoke.c"
          clang "$dir/smoke.c" -o "$dir/smoke"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp=none "$dir/smoke"
          python3 scripts/check-macos-signed.py "$dir/smoke"
          codesign --verify --strict --verbose=2 "$dir/smoke"

      - name: Build and package Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key used to sign updater artifacts (latest.json + .sig).
          # Set both in repo secrets: `tauri signer generate` to create the key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DropQTT ${{ github.ref_name }}'
          releaseBody: 'Automated release for ${{ github.ref_name }}. Download installers for macOS (Apple Silicon & Intel DMG), Linux (DEB & AppImage), and Windows (MSI & NSIS exe).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # The claim being checked is the one that caused a user-visible bug: an ad-hoc
      # signature makes the login keychain's ACL depend on the CDHash, so it changes every
      # build and "Always Allow" on the broker password dies with the next update. Green
      # jobs did not prove that was fixed; this does.
      - name: Verify the macOS artifact signature (plus notarization when configured)
        if: matrix.platform == 'macos-latest' && env.MACOS_SIGNED == '1'
        shell: bash
        run: |
          set -euo pipefail
          args="${{ matrix.args }}"
          triple=""
          case "$args" in
            *--target\ *) triple=$(printf '%s' "$args" | awk '{print $2}') ;;
          esac
          base="src-tauri/target"
          [ -n "$triple" ] && base="$base/$triple"
          dir="$base/release/bundle/macos"
          # Checked before the find: with `set -e` a failing pipeline ends the step on
          # `find`'s own message, and the operator reading the log needs the sentence
          # that says *nothing was verified* rather than a path error.
          if [ ! -d "$dir" ]; then
            echo "::error::no bundle directory at $dir — the signature was not verified"
            exit 1
          fi
          app=$(find "$dir" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$app" ]; then
            echo "::error::no .app under $dir — nothing was verified"
            exit 1
          fi
          # The signature gate always applies. The notarization gates only do, because a
          # self-signed identity cannot be notarized and stapler would then fail a build
          # that is behaving exactly as configured.
          if [ "${APPLE_NOTARIZE:-0}" = "1" ]; then
            python3 scripts/check-macos-signed.py "$app" --require-developer-id
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          else
            python3 scripts/check-macos-signed.py "$app"
            echo "::warning::notarization skipped (APPLE_NOTARIZE unset): no staple, and Gatekeeper"
            echo "::warning::will still refuse a quarantined download of this build"
          fi
