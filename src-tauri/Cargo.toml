[package]
name = "dropqtt"
version = "0.11.0"
description = "MQTT workbench: resilient file transfer, pub/sub console, data bridge, searchable history, ops diagnostics and metrics export"
authors = ["Timskt"]
edition = "2021"

# The GUI is the default binary; `dropqtt-cli` is the second one.
# Without this, `cargo run` and the bundler face two candidates.
default-run = "dropqtt"

[lib]
name = "dropqtt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rquickjs = "0.8"
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-updater = "2.0"
rumqttc = { version = "0.24", features = ["websocket"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
bytes = "1.7"
base64 = "0.22"
dirs = "5.0"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
# Broker passwords live in the OS credential store (see src/secrets.rs). The per-target
# feature sets are load-bearing: with no backend feature keyring-rs quietly compiles an
# in-process mock that answers every call and keeps nothing. `supported()` in
# secrets.rs mirrors this table one for one.
keyring = { version = "3.6", default-features = false }
x509-parser = "0.18.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
# The persistent variant is the one that survives a logout, and crypto-rust keeps the
# build off OpenSSL.
keyring = {
    version = "3.6",
    default-features = false,
    features = ["linux-native-sync-persistent", "crypto-rust"],
}
